{% extends 'base.html' %}

{% block title %}Register — LinuxQuest{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 3rem auto;">
  <div class="card" style="padding: 2.5rem 2rem;">
    <h2 style="font-family: var(--font-title); font-size: 2rem; text-align: center; color: #fff; margin-bottom: 0.5rem;">
      <i class="fas fa-user-plus text-green"></i> Start Your Quest
    </h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Create your LinuxQuest player account</p>

    {% if error %}
      <div style="background: rgba(255, 51, 102, 0.15); border: 1px solid var(--neon-red); color: var(--neon-red); padding: 0.75rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem; text-align: center;">
        <i class="fas fa-exclamation-circle"></i> {{ error }}
      </div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}">
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.9rem;">Username</label>
        <input type="text" name="username" required placeholder="cyber_hero" 
               style="width: 100%; background: var(--bg-input); border: 1px solid var(--border-color); color: #fff; padding: 0.75rem 1rem; border-radius: 8px; outline: none;">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.9rem;">Email Address</label>
        <input type="email" name="email" required placeholder="hero@linuxquest.org" 
               style="width: 100%; background: var(--bg-input); border: 1px solid var(--border-color); color: #fff; padding: 0.75rem 1rem; border-radius: 8px; outline: none;">
      </div>

      <div style="margin-bottom: 1.75rem;">
        <label style="display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.9rem;">Password</label>
        <input type="password" name="password" required placeholder="Create strong password" 
               style="width: 100%; background: var(--bg-input); border: 1px solid var(--border-color); color: #fff; padding: 0.75rem 1rem; border-radius: 8px; outline: none;">
      </div>

      <button type="submit" class="btn btn-success" style="width: 100%; padding: 0.8rem;">
        <i class="fas fa-rocket"></i> Register & Get +50 XP Bonus
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
      Already have an account? <a href="{{ url_for('login') }}">Log In</a>
    </div>
  </div>
</div>
{% endblock %}
